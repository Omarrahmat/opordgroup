name: dns-check
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          n(){ echo "::notice title=$1::$(echo "$2" | tr '\n' ' ')"; }
          n A_apex "$(dig +short A opordgroup.com @8.8.8.8)"
          n CNAME_www "$(dig +short CNAME www.opordgroup.com @8.8.8.8)"
          n A_www "$(dig +short A www.opordgroup.com @8.8.8.8)"
          n MX "$(dig +short MX opordgroup.com @8.8.8.8)"
          n TXT "$(dig +short TXT opordgroup.com @8.8.8.8)"
          n NS "$(dig +short NS opordgroup.com @8.8.8.8)"
          n HTTP_www "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' http://www.opordgroup.com/ 2>&1)"
          n HTTP_apex "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' http://opordgroup.com/ 2>&1)"
          n HTTPS_www "$(curl -sS -o /dev/null -w '%{http_code}' https://www.opordgroup.com/ 2>&1)"
          n TITLE "$(curl -sSL http://www.opordgroup.com/ | grep -o '<title>[^<]*' | head -1)"
      - run: |
          n(){ echo "::notice title=$1::$(echo "$2" | tr '\n' ' ')"; }
          n INSIGHTS "$(curl -sSL -o /dev/null -w '%{http_code}' https://www.opordgroup.com/insights/)"
          n ARTICLE "$(curl -sSL https://www.opordgroup.com/insights/martyns-law-event-organisers/ | grep -o '<title>[^<]*' | head -1)"
          n NAVLINK "$(curl -sSL https://www.opordgroup.com/ | grep -c 'insights/')"
          n HTTPS_apex "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' https://opordgroup.com/ 2>&1 | head -c 200)"
          n APEX_follow "$(curl -sSL -o /dev/null -w '%{http_code} %{url_effective}' https://opordgroup.com/ 2>&1 | head -c 200)"
          n A_apex_1111 "$(dig +short A opordgroup.com @1.1.1.1 | tr '\n' ' ') | godaddy-ns: $(dig +short A opordgroup.com @ns43.domaincontrol.com | tr '\n' ' ')"
          n PAGE_cp "$(curl -sSL -o /dev/null -w '%{http_code}' https://www.opordgroup.com/close-protection-london/)"
